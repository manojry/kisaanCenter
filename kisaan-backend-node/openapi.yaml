openapi: 3.0.3
info:
  title: KisaanCenter API
  version: 1.0.0
  description: Full API documentation for KisaanCenter backend
servers:
  - url: http://localhost:3000/api
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      properties:
        id: { type: integer }
        username: { type: string }
        role: { type: string, enum: [superadmin, owner, farmer, buyer] }
        shop_id: { type: integer, nullable: true }
        contact: { type: string, nullable: true }
        email: { type: string, nullable: true }
        status: { type: string, enum: [active, inactive], default: active }
        balance: { type: number, default: 0 }
        cumulative_value: { type: number, default: 0 }
        created_by: { type: integer, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [username, role]

    UserCreate:
      type: object
      properties:
        username: { type: string }
        role: { type: string, enum: [superadmin, owner, farmer, buyer] }
        shop_id: { type: integer, nullable: true }
        contact: { type: string, nullable: true }
        email: { type: string, nullable: true }
        password: { type: string }
        status: { type: string, enum: [active, inactive], default: active }
        balance: { type: number, default: 0 }
        cumulative_value: { type: number, default: 0 }
      required: [username, role, password]

    UserUpdate:
      type: object
      properties:
        username: { type: string }
        contact: { type: string, nullable: true }
        email: { type: string, nullable: true }
        status: { type: string, enum: [active, inactive] }
        balance: { type: number }
        cumulative_value: { type: number }

    Category:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        status: { type: string, enum: [active, inactive], default: active }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [name]

    CategoryCreate:
      type: object
      properties:
        name: { type: string }
        status: { type: string, enum: [active, inactive], default: active }
      required: [name]

    Shop:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        owner_id: { type: integer }
        status: { type: string, enum: [active, inactive], default: active }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [name, owner_id]

    ShopCreate:
      type: object
      properties:
        name: { type: string }
        owner_id: { type: integer }
        status: { type: string, enum: [active, inactive], default: active }
      required: [name, owner_id]

    Product:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        category_id: { type: integer }
        status: { type: string, enum: [active, inactive], default: active }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [name, category_id]

    ProductCreate:
      type: object
      properties:
        name: { type: string }
        category_id: { type: integer }
        status: { type: string, enum: [active, inactive], default: active }
      required: [name, category_id]

    Transaction:
      type: object
      properties:
        id: { type: integer }
        shop_id: { type: integer }
        farmer_id: { type: integer }
        buyer_id: { type: integer }
        product_name: { type: string }
        quantity: { type: number, minimum: 0 }
        unit_price: { type: number, minimum: 0 }
        total_sale_value: { type: number, minimum: 0 }
        shop_commission: { type: number, minimum: 0 }
        farmer_earning: { type: number, minimum: 0 }
        status: { type: string, enum: [pending, completed, cancelled], default: pending }
        transaction_date: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [shop_id, farmer_id, buyer_id, product_name, quantity, unit_price]

    TransactionCreate:
      type: object
      properties:
        shop_id: { type: integer }
        farmer_id: { type: integer }
        buyer_id: { type: integer }
        product_name: { type: string }
        quantity: { type: number, minimum: 0 }
        unit_price: { type: number, minimum: 0 }
        transaction_date: { type: string, format: date-time }
      required: [shop_id, farmer_id, buyer_id, product_name, quantity, unit_price]

    Payment:
      type: object
      properties:
        id: { type: integer }
        transaction_id: { type: integer }
        payer_type: { type: string, enum: [BUYER, SHOP] }
        payee_type: { type: string, enum: [SHOP, FARMER] }
        amount: { type: number, minimum: 0 }
        status: { type: string, enum: [PENDING, PAID, FAILED], default: PENDING }
        payment_date: { type: string, format: date-time, nullable: true }
        method: { type: string, enum: [CASH, BANK, UPI, OTHER], default: CASH }
        notes: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [transaction_id, payer_type, payee_type, amount]

    PaymentCreate:
      type: object
      properties:
        transaction_id: { type: integer }
        payer_type: { type: string, enum: [BUYER, SHOP] }
        payee_type: { type: string, enum: [SHOP, FARMER] }
        amount: { type: number, minimum: 0 }
        method: { type: string, enum: [CASH, BANK, UPI, OTHER], default: CASH }
        notes: { type: string, nullable: true }
        payment_date: { type: string, format: date-time, nullable: true }
      required: [transaction_id, payer_type, payee_type, amount]

    Settlement:
      type: object
      properties:
        id: { type: integer }
        shop_id: { type: integer }
        user_id: { type: integer }
        amount: { type: number }
        reason: { type: string, enum: [overpayment, underpayment, adjustment] }
        status: { type: string, enum: [pending, settled], default: pending }
        settlement_date: { type: string, format: date-time, nullable: true }
        notes: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [shop_id, user_id, amount, reason]

    SettlementCreate:
      type: object
      properties:
        shop_id: { type: integer }
        user_id: { type: integer }
        amount: { type: number }
        reason: { type: string, enum: [overpayment, underpayment, adjustment] }
        notes: { type: string, nullable: true }
      required: [shop_id, user_id, amount, reason]

    ShopCategory:
      type: object
      properties:
        id: { type: integer }
        shop_id: { type: integer }
        category_id: { type: integer }
        is_active: { type: boolean, default: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [shop_id, category_id]

    # Response schemas
    PaginatedResponse:
      type: object
      properties:
        data: { type: array }
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }
        totalPages: { type: integer }

    ApiResponse:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        data: { }

    ErrorResponse:
      type: object
      properties:
        success: { type: boolean, default: false }
        message: { type: string }
        error: { type: string }

    LoginRequest:
      type: object
      properties:
        username: { type: string }
        password: { type: string }
      required: [username, password]

    LoginResponse:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        token: { type: string }
        user: { $ref: '#/components/schemas/User' }

    BusinessSummary:
      type: object
      properties:
        totalUsers: { type: integer }
        totalTransactions: { type: integer }
        totalPayments: { type: integer }
        totalSettlements: { type: integer }
        totalRevenue: { type: number }
        activeShops: { type: integer }
        pendingPayments: { type: integer }

paths:
  /users:
    post:
      summary: Create a new user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserCreate' }
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema: 
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/User' }
        '400':
          description: Bad request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    get:
      summary: Get all users
      parameters:
        - in: query
          name: role
          schema: { type: string, enum: [superadmin, owner, farmer, buyer] }
        - in: query
          name: status
          schema: { type: string, enum: [active, inactive] }
        - in: query
          name: shop_id
          schema: { type: integer }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/User' }

  /users/{id}:
    get:
      summary: Get user by ID
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/User' }
        '404':
          description: User not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    put:
      summary: Update user
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdate' }
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/User' }
        '404':
          description: User not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    delete:
      summary: Delete user
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: User deleted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
        '404':
          description: User not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /users/me:
    get:
      summary: Get current user
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
