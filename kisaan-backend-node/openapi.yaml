                    properties:
                      data: { $ref: '#/components/schemas/Payment' }
        '400':
          description: Bad request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    get:
      summary: Get all payments
      parameters:
        - in: query
          name: transaction_id
          schema: { type: integer }
        - in: query
          name: status
          schema: { type: string, enum: [PENDING, PAID, FAILED] }
        - in: query
          name: payer_type
