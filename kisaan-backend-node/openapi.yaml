openapi: 3.0.3
info:
  title: KisaanCenter API
  version: 1.0.0
  description: Full API documentation for KisaanCenter backend
servers:
  - url: http://localhost:3000/api
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      properties:
        id: { type: integer }
        username: { type: string }
        role: { type: string, enum: [superadmin, owner, farmer, buyer] }
        owner_id: { type: string, nullable: true }
        shop_id: { type: integer, nullable: true }
        contact: { type: string, nullable: true }
        email: { type: string, nullable: true }
        status: { type: string, enum: [active, inactive] }
        balance: { type: number }
        cumulative_value: { type: number }
        created_by: { type: integer, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Category:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        status: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Shop:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        owner_id: { type: integer }
        status: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Product:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        category_id: { type: integer }
        status: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Transaction:
      type: object
      properties:
        id: { type: integer }
        shop_id: { type: integer }
        farmer_id: { type: integer }
        buyer_id: { type: integer }
        product_name: { type: string }
        quantity: { type: number }
        unit_price: { type: number }
        total_sale_value: { type: number }
        shop_commission: { type: number }
        farmer_earning: { type: number }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Payment:
      type: object
      properties:
        id: { type: integer }
        transaction_id: { type: integer }
        payer_type: { type: string, enum: [BUYER, SHOP] }
        payee_type: { type: string, enum: [SHOP, FARMER] }
        amount: { type: number }
        status: { type: string, enum: [PENDING, PAID, FAILED] }
        payment_date: { type: string, format: date-time, nullable: true }
        method: { type: string, enum: [CASH, BANK, UPI, OTHER] }
        notes: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Settlement:
      type: object
      properties:
        id: { type: integer }
        shop_id: { type: integer }
        user_id: { type: integer }
        amount: { type: number }
        reason: { type: string, enum: [overpayment, underpayment, adjustment] }
        status: { type: string, enum: [pending, settled] }
        settlement_date: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
paths:
  /users:
    post:
      summary: Create a new user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/User' }
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
    get:
      summary: Get all users
      parameters:
        - in: query
          name: role
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: owner_id
          schema: { type: string }
        - in: query
          name: shop_id
          schema: { type: integer }
        - in: query
          name: page
          schema: { type: integer }
        - in: query
          name: limit
          schema: { type: integer }
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/User' }
                  total: { type: integer }
                  page: { type: integer }
                  limit: { type: integer }
  /users/{id}:
    get:
      summary: Get user by ID
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
    put:
      summary: Update user
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/User' }
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
    delete:
      summary: Delete user
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: User deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
