name: 🧪 Test Suite

on:
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Type of tests to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - unit
          - integration
          - api
          - performance
      python_version:
        description: 'Python version to test with'
        required: false
        default: '3.11'
        type: choice
        options:
          - '3.10'
          - '3.11'
          - '3.12'
      coverage_threshold:
        description: 'Minimum code coverage percentage'
        required: false
        default: 80
        type: number

  schedule:
    # Run tests daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  test-matrix:
    name: 🧪 Test Suite (${{ matrix.test-type }} - Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.python_version)) || fromJSON('["3.10", "3.11", "3.12"]') }}
        test-type: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.test_type)) || fromJSON('["unit", "integration", "api"]') }}

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_kisaan_center
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-asyncio pytest-mock httpx faker
          pip install pytest-html pytest-json-report pytest-benchmark
          pip install -r backend/requirements.txt

      - name: 🔧 Setup test environment
        run: |
          cat > backend/.env.test << EOF
          DB_HOST=localhost
          DB_PORT=5432
          DB_NAME=test_kisaan_center
          DB_USER=test_user
          DB_PASSWORD=test_password
          DB_SSL_MODE=disable
          ENVIRONMENT=testing
          REDIS_URL=redis://localhost:6379/0
          EOF

      - name: 🗄️ Setup test database
        run: |
          cd backend
          export PYTHONPATH=$PWD
          python -c "
          from src.database import db_manager
          from src.models import Base
          try:
              engine = db_manager.initialize_engine()
              Base.metadata.create_all(bind=engine)
              print('✅ Test database schema created')
          except Exception as e:
              print(f'❌ Database setup failed: {e}')
              exit(1)
          "

      - name: 🧪 Run Unit Tests
        if: ${{ matrix.test-type == 'all' || matrix.test-type == 'unit' }}
        run: |
          cd backend
          export PYTHONPATH=$PWD
          python -m pytest tests/unit/ -v \
            --cov=src \
            --cov-report=xml:coverage-unit.xml \
            --cov-report=html:htmlcov-unit \
            --html=report-unit.html \
            --json-report --json-report-file=report-unit.json
        env:
          COVERAGE_THRESHOLD: ${{ inputs.coverage_threshold || 80 }}

      - name: 🔗 Run Integration Tests
        if: ${{ matrix.test-type == 'all' || matrix.test-type == 'integration' }}
        run: |
          cd backend
          export PYTHONPATH=$PWD
          python -m pytest tests/integration/ -v \
            --cov=src \
            --cov-report=xml:coverage-integration.xml \
            --cov-report=html:htmlcov-integration \
            --html=report-integration.html \
            --json-report --json-report-file=report-integration.json
        continue-on-error: true

      - name: 🌐 Run API Tests
        if: ${{ matrix.test-type == 'all' || matrix.test-type == 'api' }}
        run: |
          cd backend
          export PYTHONPATH=$PWD
          
          # Start the API server in background
          uvicorn src.main:app --host 0.0.0.0 --port 8000 &
          SERVER_PID=$!
          
          # Wait for server to start
          sleep 10
          
          # Run API tests
          python -m pytest tests/api/ -v \
            --html=report-api.html \
            --json-report --json-report-file=report-api.json
          
          # Stop the server
          kill $SERVER_PID
        continue-on-error: true

      - name: ⚡ Run Performance Tests
        if: ${{ matrix.test-type == 'all' || matrix.test-type == 'performance' }}
        run: |
          cd backend
          export PYTHONPATH=$PWD
          python -m pytest tests/performance/ -v \
            --benchmark-only \
            --benchmark-json=benchmark.json \
            --html=report-performance.html
        continue-on-error: true

      - name: 📊 Upload test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: test-results-${{ matrix.test-type }}-python-${{ matrix.python-version }}
          path: |
            backend/htmlcov*/
            backend/coverage*.xml
            backend/report*.html
            backend/report*.json
            backend/benchmark.json

      - name: 📈 Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        if: matrix.python-version == '3.11'
        with:
          file: backend/coverage*.xml
          flags: ${{ matrix.test-type }}
          name: codecov-${{ matrix.test-type }}

      - name: 🎯 Check coverage threshold
        if: ${{ matrix.test-type == 'unit' || matrix.test-type == 'all' }}
        run: |
          cd backend
          coverage report --fail-under=${{ inputs.coverage_threshold || 80 }}

  test-summary:
    name: 📊 Test Summary
    runs-on: ubuntu-latest
    needs: test-matrix
    if: always()
    steps:
      - name: 📊 Create test summary
        run: |
          echo "## 🧪 Test Suite Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Type | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          
          # Note: In a real scenario, you'd extract actual results from artifacts
          echo "| Unit Tests | ${{ contains(needs.test-matrix.result, 'success') && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration Tests | ${{ contains(needs.test-matrix.result, 'success') && '✅ Passed' || '⚠️ See logs' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| API Tests | ${{ contains(needs.test-matrix.result, 'success') && '✅ Passed' || '⚠️ See logs' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Coverage Reports and detailed results are available in the artifacts.**" >> $GITHUB_STEP_SUMMARY
