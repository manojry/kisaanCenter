name: 🐳 Docker Build & Push

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag'
        required: false
        default: 'latest'
        type: string
      push_to_registry:
        description: 'Push to GitHub Container Registry'
        required: false
        default: true
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker-build:
    name: 🏗️ Build Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🏗️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Login to Container Registry
        if: ${{ inputs.push_to_registry }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 📋 Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.tag }}
            type=sha,prefix={{branch}}-

      - name: 🐳 Create optimized Dockerfile
        run: |
          cat > Dockerfile << 'EOF'
          # Multi-stage build for smaller image size
          FROM python:3.11-slim as builder
          
          WORKDIR /app
          
          # Install build dependencies
          RUN apt-get update && apt-get install -y \
              gcc \
              libpq-dev \
              && rm -rf /var/lib/apt/lists/*
          
          # Create virtual environment
          RUN python -m venv /opt/venv
          ENV PATH="/opt/venv/bin:$PATH"
          
          # Install Python dependencies
          COPY backend/requirements.txt .
          RUN pip install --upgrade pip && \
              pip install --no-cache-dir -r requirements.txt
          
          # Production stage
          FROM python:3.11-slim as production
          
          WORKDIR /app
          
          # Install runtime dependencies
          RUN apt-get update && apt-get install -y \
              libpq5 \
              curl \
              && rm -rf /var/lib/apt/lists/* \
              && apt-get clean
          
          # Copy virtual environment from builder
          COPY --from=builder /opt/venv /opt/venv
          ENV PATH="/opt/venv/bin:$PATH"
          
          # Copy application code
          COPY backend/ .
          
          # Create non-root user
          RUN useradd --create-home --shell /bin/bash --uid 1000 app && \
              chown -R app:app /app
          USER app
          
          # Expose port
          EXPOSE 8000
          
          # Health check
          HEALTHCHECK --interval=30s --timeout=10s --start-period=5s --retries=3 \
            CMD curl -f http://localhost:8000/health || exit 1
          
          # Start application
          CMD ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
          EOF

      - name: 🏗️ Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ inputs.push_to_registry }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: 📊 Image summary
        run: |
          echo "## 🐳 Docker Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Usage:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "docker run -p 8000:8000 ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
