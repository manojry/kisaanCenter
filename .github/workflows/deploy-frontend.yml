name: Deploy Frontend to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'kisaan-frontend/**'
      - '.github/workflows/deploy-frontend.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: 🛎️ Checkout
      uses: actions/checkout@v4

    - name: 📦 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: kisaan-frontend/package-lock.json

    - name: 🔧 Create production environment file
      working-directory: kisaan-frontend
      run: |
        echo "Creating .env.production with Azure backend URL..."
        cat > .env.production << EOF
        # Production environment configuration (auto-generated)
        VITE_API_BASE_URL=https://kisaancenter-backend.whiteisland-e1233153.northeurope.azurecontainerapps.io/api
        VITE_APP_TITLE=KisaanCenter
        VITE_APP_DESCRIPTION=Market Management System
        VITE_APP_VERSION=1.0.0
        VITE_ENVIRONMENT=production
        VITE_BACKEND_URL=https://kisaancenter-backend.whiteisland-e1233153.northeurope.azurecontainerapps.io/api
        VITE_API_TIMEOUT=30000
        VITE_ENABLE_LOGGING=false
        EOF
        
        echo "✅ Environment file created successfully"
        echo "Backend URL will be: https://kisaancenter-backend.whiteisland-e1233153.northeurope.azurecontainerapps.io/api"

    - name: 📥 Install dependencies
      working-directory: kisaan-frontend
      run: npm ci

    - name: 🏗️ Build
      working-directory: kisaan-frontend
      run: npm run build

    - name: 📄 Setup Pages
      uses: actions/configure-pages@v4

    - name: 📤 Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: kisaan-frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - name: 🚀 Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

    - name: 📋 Deployment Summary
      run: |
        echo "🎉 Frontend Deployment Summary"
        echo "=============================="
        echo "✅ Site URL: ${{ steps.deployment.outputs.page_url }}"
        echo "✅ Custom Domain: https://kisaancenter.com"
        echo "✅ Backend API: https://kisaancenter-backend.whiteisland-e1233153.northeurope.azurecontainerapps.io/api"
        echo "✅ Commit SHA: ${{ github.sha }}"