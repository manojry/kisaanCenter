name: Azure Container Apps Deployment

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/azure-deploy.yml'
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deployment even if no backend changes'
        required: false
        default: false
        type: boolean

env:
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  AZURE_RESOURCE_GROUP: kisaancenter-rg
  AZURE_CONTAINER_REGISTRY: kisaancenteracrus3alh
  AZURE_CONTAINER_APP: kisaancenter-backend
  IMAGE_NAME: kisaancenter-backend

jobs:
  build-and-deploy:
    name: 🏗️ Build & Deploy to Azure
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔐 Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: 🏗️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Login to Azure Container Registry
        run: |
          az acr login --name ${{ env.AZURE_CONTAINER_REGISTRY }}

      - name: 📋 Set image tag
        id: image-tag
        run: |
          IMAGE_TAG="${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          LATEST_TAG="${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.IMAGE_NAME }}:latest"
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "🏷️ Image tag: $IMAGE_TAG"

      - name: 🐳 Create Dockerfile
        run: |
          cat > Dockerfile << 'EOF'
          FROM python:3.11-slim

          # Set working directory
          WORKDIR /app

          # Install system dependencies
          RUN apt-get update && apt-get install -y \
              gcc \
              postgresql-client \
              curl \
              && rm -rf /var/lib/apt/lists/*

          # Copy requirements and install Python dependencies
          COPY backend/requirements.txt .
          RUN pip install --no-cache-dir --upgrade pip && \
              pip install --no-cache-dir -r requirements.txt

          # Copy application code
          COPY backend/src ./src
          COPY backend/migrations ./migrations

          # Create non-root user for security
          RUN useradd --create-home --shell /bin/bash appuser && \
              chown -R appuser:appuser /app
          USER appuser

          # Expose port
          EXPOSE 8000

          # Health check
          HEALTHCHECK --interval=30s --timeout=10s --start-period=5s --retries=3 \
            CMD curl -f http://localhost:8000/health || exit 1

          # Set Python path
          ENV PYTHONPATH=/app

          # Start application
          CMD ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]
          EOF

      - name: 🏗️ Build and push Docker image
        run: |
          docker build -t ${{ steps.image-tag.outputs.image_tag }} .
          docker tag ${{ steps.image-tag.outputs.image_tag }} ${{ steps.image-tag.outputs.latest_tag }}
          
          # Push both tags
          docker push ${{ steps.image-tag.outputs.image_tag }}
          docker push ${{ steps.image-tag.outputs.latest_tag }}
          
          echo "✅ Image pushed successfully"

      - name: 🔄 Update Container App
        run: |
          echo "🔄 Updating Container App with new image..."
          
          az containerapp update \
            --name ${{ env.AZURE_CONTAINER_APP }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --image ${{ steps.image-tag.outputs.latest_tag }} \
            --output table
          
          echo "✅ Container App updated successfully"

      - name: 🚀 Get Container App URL
        id: app-url
        run: |
          FQDN=$(az containerapp show \
            --name ${{ env.AZURE_CONTAINER_APP }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" \
            --output tsv)
          
          if [ ! -z "$FQDN" ]; then
            APP_URL="https://$FQDN"
            echo "app_url=$APP_URL" >> $GITHUB_OUTPUT
            echo "🌐 Application URL: $APP_URL"
          else
            echo "⚠️  Could not retrieve application URL"
          fi

      - name: 🏥 Health Check
        if: steps.app-url.outputs.app_url
        run: |
          echo "🏥 Performing health check..."
          HEALTH_URL="${{ steps.app-url.outputs.app_url }}/health"
          
          # Wait for deployment to complete
          echo "⏳ Waiting for deployment to complete..."
          sleep 30
          
          # Retry health check up to 5 times
          for i in {1..5}; do
            echo "🔍 Health check attempt $i/5..."
            
            if curl -f -s "$HEALTH_URL" > /dev/null; then
              echo "✅ Application is healthy!"
              echo "🌐 Health endpoint: $HEALTH_URL"
              break
            else
              echo "⚠️  Health check failed, retrying in 10 seconds..."
              sleep 10
            fi
            
            if [ $i -eq 5 ]; then
              echo "❌ Health check failed after 5 attempts"
              echo "🔍 Checking Container App logs..."
              az containerapp logs show \
                --name ${{ env.AZURE_CONTAINER_APP }} \
                --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
                --tail 50 || true
              exit 1
            fi
          done

      - name: 📊 Deployment Summary
        run: |
          echo "## 🎯 Azure Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Details |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🐳 Image | \`${{ steps.image-tag.outputs.latest_tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🏷️  Tag | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 📦 Registry | \`${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🚀 Container App | \`${{ env.AZURE_CONTAINER_APP }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🏢 Resource Group | \`${{ env.AZURE_RESOURCE_GROUP }}\` |" >> $GITHUB_STEP_SUMMARY
          
          if [ ! -z "${{ steps.app-url.outputs.app_url }}" ]; then
            echo "| 🌐 Application URL | [${{ steps.app-url.outputs.app_url }}](${{ steps.app-url.outputs.app_url }}) |" >> $GITHUB_STEP_SUMMARY
            echo "| 🏥 Health Check | [${{ steps.app-url.outputs.app_url }}/health](${{ steps.app-url.outputs.app_url }}/health) |" >> $GITHUB_STEP_SUMMARY
            echo "| 📚 API Docs | [${{ steps.app-url.outputs.app_url }}/docs](${{ steps.app-url.outputs.app_url }}/docs) |" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Deployment completed successfully!**" >> $GITHUB_STEP_SUMMARY

      - name: 💬 Comment on PR (if applicable)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const appUrl = '${{ steps.app-url.outputs.app_url }}';
            if (appUrl) {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `🚀 **Backend deployed successfully!**
                
                📱 **Preview Links:**
                - 🌐 Application: ${appUrl}
                - 🏥 Health Check: ${appUrl}/health
                - 📚 API Documentation: ${appUrl}/docs
                
                🐳 **Docker Image:** \`${{ steps.image-tag.outputs.latest_tag }}\``
              });
            }