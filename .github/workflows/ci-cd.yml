name: KisaanCenter CI/CD Pipeline

on:
  # Trigger on push to main branch (required stages only)
  push:
    branches: [ main ]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'Documents/**'
      - '.gitignore'
      - 'LICENSE'

  # Trigger on pull requests to main
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'Documents/**'

  # Manual trigger with advanced options
  workflow_dispatch:
    inputs:
      skip_lint:
        description: 'Skip code linting and formatting checks'
        required: false
        default: false
        type: boolean
      skip_tests:
        description: 'Skip test execution (not recommended)'
        required: false
        default: false
        type: boolean
      skip_security:
        description: 'Skip security vulnerability scans'
        required: false
        default: false
        type: boolean
      skip_build:
        description: 'Skip Docker image build'
        required: false
        default: false
        type: boolean
      create_release:
        description: 'Create a new release'
        required: false
        default: false
        type: boolean
      release_tag:
        description: 'Release tag (e.g., v1.0.0, v0.0.1)'
        required: false
        default: ''
        type: string
      release_type:
        description: 'Type of release'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      environment:
        description: 'Target environment for deployment'
        required: false
        default: 'development'
        type: choice
        options:
          - development
          - staging
          - production

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Job 1: Setup and Validation
  setup:
    name: 🔧 Setup & Validation
    runs-on: ubuntu-latest
    outputs:
      python-version: ${{ steps.setup.outputs.python-version }}
      node-version: ${{ steps.setup.outputs.node-version }}
      should-deploy: ${{ steps.check.outputs.should-deploy }}
      release-needed: ${{ steps.check.outputs.release-needed }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔍 Validate project structure
        id: setup
        run: |
          echo "python-version=${{ env.PYTHON_VERSION }}" >> $GITHUB_OUTPUT
          echo "node-version=${{ env.NODE_VERSION }}" >> $GITHUB_OUTPUT
          
          # Validate required files
          required_files=(
            "backend/requirements.txt"
            "backend/src/main.py"
            "backend/src/models.py"
            "backend/src/database.py"
          )
          
          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "❌ Required file missing: $file"
              exit 1
            fi
          done
          
          echo "✅ Project structure validated"

      - name: 🎯 Check deployment conditions
        id: check
        run: |
          should_deploy="false"
          release_needed="false"
          
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            should_deploy="true"
          fi
          
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.create_release }}" == "true" ]]; then
            release_needed="true"
          fi
          
          echo "should-deploy=$should_deploy" >> $GITHUB_OUTPUT
          echo "release-needed=$release_needed" >> $GITHUB_OUTPUT

  # Job 2: Code Quality & Linting
  lint:
    name: 🧹 Code Quality & Linting
    runs-on: ubuntu-latest
    needs: setup
    if: ${{ !inputs.skip_lint }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ needs.setup.outputs.python-version }}
          cache: 'pip'

      - name: 📦 Install linting dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black isort flake8 mypy bandit safety
          pip install -r backend/requirements.txt

      - name: 🎨 Check code formatting with Black
        run: |
          echo "🎨 Checking Python code formatting..."
          black --check --diff backend/src/
          if [ $? -ne 0 ]; then
            echo "❌ Code formatting issues found. Run 'black backend/src/' to fix."
            exit 1
          fi
          echo "✅ Code formatting is correct"

      - name: 📋 Check import sorting with isort
        run: |
          echo "📋 Checking import sorting..."
          isort --check-only --diff backend/src/
          if [ $? -ne 0 ]; then
            echo "❌ Import sorting issues found. Run 'isort backend/src/' to fix."
            exit 1
          fi
          echo "✅ Import sorting is correct"

      - name: 🔍 Lint with flake8
        run: |
          echo "🔍 Running flake8 linting..."
          flake8 backend/src/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 backend/src/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: 🔒 Security scan with bandit
        run: |
          echo "🔒 Running security scan..."
          bandit -r backend/src/ -f json -o bandit-report.json
          bandit -r backend/src/
        continue-on-error: true

      - name: 📊 Upload security scan results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: security-scan-results
          path: bandit-report.json

  # Job 3: Test Suite
  test:
    name: 🧪 Test Suite
    runs-on: ubuntu-latest
    needs: setup
    if: ${{ !inputs.skip_tests }}
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_kisaan_center
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-asyncio httpx
          pip install -r backend/requirements.txt

      - name: 🔧 Setup test environment
        run: |
          # Create test environment file
          cat > backend/.env.test << EOF
          DB_HOST=localhost
          DB_PORT=5432
          DB_NAME=test_kisaan_center
          DB_USER=test_user
          DB_PASSWORD=test_password
          DB_SSL_MODE=disable
          ENVIRONMENT=testing
          EOF

      - name: 🗄️ Setup test database
        run: |
          cd backend
          export PYTHONPATH=/home/runner/work/kisaanCenter/kisaanCenter/backend
          python -c "
          from src.db.connection import db_manager
          try:
              db_manager.create_database_if_not_exists()
              print('✅ Test database created')
          except Exception as e:
              print(f'Database creation failed: {e}')
          "

      - name: 🧪 Run unit tests
        run: |
          cd backend
          export PYTHONPATH=/home/runner/work/kisaanCenter/kisaanCenter/backend
          python -m pytest tests/ -v --cov=src --cov-report=xml --cov-report=html
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: test_kisaan_center
          DB_USER: test_user
          DB_PASSWORD: test_password

      - name: 📊 Upload test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: test-results-python-${{ matrix.python-version }}
          path: |
            backend/htmlcov/
            backend/coverage.xml

      - name: 📈 Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        if: matrix.python-version == '3.11'
        with:
          file: backend/coverage.xml
          flags: unittests
          name: codecov-umbrella

  # Job 4: Security & Vulnerability Scan
  security:
    name: 🔒 Security & Vulnerability Scan
    runs-on: ubuntu-latest
    needs: setup
    if: ${{ !inputs.skip_security }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ needs.setup.outputs.python-version }}

      - name: 🔒 Check for vulnerabilities with Safety
        run: |
          pip install safety
          safety check -r backend/requirements.txt --json --output safety-report.json
        continue-on-error: true

      - name: 🕵️ CodeQL Analysis
        uses: github/codeql-action/init@v2
        with:
          languages: python
          queries: security-and-quality

      - name: 🔍 Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2

      - name: 📊 Upload security reports
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: security-reports
          path: safety-report.json

  # Job 5: Build & Package
  build:
    name: 🏗️ Build & Package
    runs-on: ubuntu-latest
    needs: [setup, lint, test]
    if: ${{ !inputs.skip_build && (always() && !cancelled()) }}
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🏗️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 📋 Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix={{branch}}-

      - name: 🐳 Create Dockerfile
        run: |
          cat > Dockerfile << 'EOF'
          FROM python:3.11-slim
          
          WORKDIR /app
          
          # Install system dependencies
          RUN apt-get update && apt-get install -y \
              gcc \
              postgresql-client \
              && rm -rf /var/lib/apt/lists/*
          
          # Copy requirements and install Python dependencies
          COPY backend/requirements.txt .
          RUN pip install --no-cache-dir -r requirements.txt
          
          # Copy application code
          COPY backend/ .
          
          # Create non-root user
          RUN useradd --create-home --shell /bin/bash app && chown -R app:app /app
          USER app
          
          # Expose port
          EXPOSE 8000
          
          # Health check
          HEALTHCHECK --interval=30s --timeout=30s --start-period=5s --retries=3 \
            CMD curl -f http://localhost:8000/health || exit 1
          
          # Start application
          CMD ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000"]
          EOF

      - name: 🏗️ Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  # Job 6: Release Creation
  release:
    name: 🚀 Create Release
    runs-on: ubuntu-latest
    needs: [setup, build]
    if: ${{ needs.setup.outputs.release-needed == 'true' && (success() || inputs.skip_tests) }}
    outputs:
      release-tag: ${{ steps.create-release.outputs.tag_name }}
      release-url: ${{ steps.create-release.outputs.html_url }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🏷️ Determine release tag
        id: tag
        run: |
          if [[ -n "${{ inputs.release_tag }}" ]]; then
            TAG="${{ inputs.release_tag }}"
          else
            # Auto-generate tag based on release type
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
            IFS='.' read -ra VERSION <<< "${LATEST_TAG#v}"
            
            case "${{ inputs.release_type }}" in
              "major")
                NEW_TAG="v$((${VERSION[0]} + 1)).0.0"
                ;;
              "minor")
                NEW_TAG="v${VERSION[0]}.$((${VERSION[1]} + 1)).0"
                ;;
              "patch"|*)
                NEW_TAG="v${VERSION[0]}.${VERSION[1]}.$((${VERSION[2]} + 1))"
                ;;
            esac
            TAG="$NEW_TAG"
          fi
          
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "📋 Release tag: $TAG"

      - name: 📝 Generate changelog
        id: changelog
        run: |
          # Get commits since last tag
          LAST_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [[ -n "$LAST_TAG" ]]; then
            COMMITS=$(git log --pretty=format:"- %s (%h)" $LAST_TAG..HEAD)
          else
            COMMITS=$(git log --pretty=format:"- %s (%h)" --max-count=10)
          fi
          
          # Create changelog
          cat > CHANGELOG.md << EOF
          ## What's Changed
          
          $COMMITS
          
          ## Docker Image
          \`\`\`bash
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
          \`\`\`
          
          ## API Documentation
          - Swagger UI: \`/docs\`
          - ReDoc: \`/redoc\`
          - Health Check: \`/health\`
          
          **Full Changelog**: https://github.com/${{ github.repository }}/compare/$LAST_TAG...${{ steps.tag.outputs.tag }}
          EOF

      - name: 🚀 Create GitHub Release
        id: create-release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          release_name: KisaanCenter ${{ steps.tag.outputs.tag }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.tag, '-') }}

      - name: 📊 Update project documentation
        run: |
          # Update version in files if they exist
          if [[ -f "backend/src/main.py" ]]; then
            sed -i 's/version="[^"]*"/version="${{ steps.tag.outputs.tag }}"/' backend/src/main.py
          fi
          
          echo "✅ Release ${{ steps.tag.outputs.tag }} created successfully!"

  # Job 7: Deployment
  deploy:
    name: 🚀 Deploy to ${{ inputs.environment || 'development' }}
    runs-on: ubuntu-latest
    needs: [setup, build]
    if: ${{ needs.setup.outputs.should-deploy == 'true' || github.event_name == 'workflow_dispatch' }}
    environment: ${{ inputs.environment || 'development' }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🚀 Deploy to ${{ inputs.environment || 'development' }}
        run: |
          echo "🚀 Deploying to ${{ inputs.environment || 'development' }} environment"
          echo "🐳 Image: ${{ needs.build.outputs.image-tag }}"
          echo "📝 Digest: ${{ needs.build.outputs.image-digest }}"
          
          # Add your deployment logic here
          # This could include:
          # - Updating Kubernetes manifests
          # - Triggering deployment webhooks
          # - Updating Docker Compose files
          # - Notifying deployment systems
          
          echo "✅ Deployment completed successfully!"

  # Job 8: Notification & Cleanup
  notify:
    name: 📢 Notify & Cleanup
    runs-on: ubuntu-latest
    needs: [setup, lint, test, security, build, release, deploy]
    if: always()
    steps:
      - name: 📊 Workflow Summary
        run: |
          echo "## 🎯 KisaanCenter CI/CD Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Setup | ${{ needs.setup.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ (needs.lint.result == 'success' || needs.lint.result == 'skipped') && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test | ${{ (needs.test.result == 'success' || needs.test.result == 'skipped') && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security | ${{ (needs.security.result == 'success' || needs.security.result == 'skipped') && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ (needs.build.result == 'success' || needs.build.result == 'skipped') && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Release | ${{ (needs.release.result == 'success' || needs.release.result == 'skipped') && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy | ${{ (needs.deploy.result == 'success' || needs.deploy.result == 'skipped') && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ needs.release.result }}" == "success" ]]; then
            echo "🎉 **New Release Created**: ${{ needs.release.outputs.release-tag }}" >> $GITHUB_STEP_SUMMARY
            echo "🔗 **Release URL**: ${{ needs.release.outputs.release-url }}" >> $GITHUB_STEP_SUMMARY
          fi

      - name: 🧹 Cleanup artifacts
        run: |
          echo "🧹 Cleaning up temporary artifacts..."
          # Add cleanup logic if needed
          echo "✅ Cleanup completed"
