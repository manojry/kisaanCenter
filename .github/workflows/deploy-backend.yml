name: Deploy Backend to Azure Container Apps

on:
  push:
    branches: [ main ]
    paths: [ 'backend/**' ]
  pull_request:
    branches: [ main ]
    paths: [ 'backend/**' ]
  workflow_dispatch:

env:
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
  AZURE_CONTAINER_REGISTRY: ${{ secrets.AZURE_CONTAINER_REGISTRY }}
  AZURE_CONTAINER_APP_NAME: ${{ secrets.AZURE_CONTAINER_APP_NAME }}
  AZURE_CONTAINER_APP_ENVIRONMENT: ${{ secrets.AZURE_CONTAINER_APP_ENVIRONMENT }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: 🛎️ Checkout code
      uses: actions/checkout@v4

    - name: 🔑 Login to Azure
      uses: azure/login@v1
      with:
        creds: |
          {
            "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
            "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
            "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
            "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
          }

    - name: 🐳 Login to Azure Container Registry
      run: |
        echo ${{ secrets.AZURE_REGISTRY_PASSWORD }} | docker login ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }} \
          --username ${{ secrets.AZURE_REGISTRY_USERNAME }} \
          --password-stdin

    - name: 🏗️ Build Docker image
      run: |
        cd backend
        docker build -t ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/kisaancenter-backend:${{ github.sha }} .
        docker tag ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/kisaancenter-backend:${{ github.sha }} \
          ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/kisaancenter-backend:latest

    - name: 📦 Push image to ACR
      run: |
        docker push ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/kisaancenter-backend:${{ github.sha }}
        docker push ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/kisaancenter-backend:latest

    - name: 🚀 Deploy to Container Apps
      run: |
        az containerapp update \
          --name ${{ env.AZURE_CONTAINER_APP_NAME }} \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --image ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/kisaancenter-backend:${{ github.sha }}

    - name: ✅ Verify deployment
      run: |
        # Wait for deployment to complete
        sleep 30
        
        # Get the app URL
        APP_URL=$(az containerapp show \
          --name ${{ env.AZURE_CONTAINER_APP_NAME }} \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --query properties.configuration.ingress.fqdn -o tsv)
        
        echo "🎯 Deployment completed!"
        echo "📱 App URL: https://$APP_URL"
        
        # Basic health check (if health endpoint exists)
        if curl -f -s "https://$APP_URL/health" > /dev/null 2>&1; then
          echo "✅ Health check passed"
        else
          echo "⚠️ Health check endpoint not available (this is normal for new deployments)"
        fi

    - name: 📋 Deployment Summary
      run: |
        echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
        echo "- **Image**: \`${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/kisaancenter-backend:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Container App**: \`${{ env.AZURE_CONTAINER_APP_NAME }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Resource Group**: \`${{ env.AZURE_RESOURCE_GROUP }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Triggered by**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY