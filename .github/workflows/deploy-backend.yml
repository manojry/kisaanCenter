name: Deploy Backend to Azure Container Apps (FREE Tier)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'kisaan-backend-node/**'
      - '.github/workflows/deploy-backend.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: manojry/kisaancenter/backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      
    steps:
    - name: 🛎️ Checkout code
      uses: actions/checkout@v4

    - name: 🔑 Login to Azure
      uses: azure/login@v1
      with:
        creds: |
          {
            "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
            "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
            "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
            "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
          }

    - name: 🐳 Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: 📋 Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: 🏗️ Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./kisaan-backend-node
        file: ./kisaan-backend-node/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

    #- name: 🚀 AZ ghcr login
      # run: |
      #   az containerapp registry set \
      #     --name ${{ secrets.AZURE_CONTAINER_APP_NAME }} \
      #     --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
      #     --server ghcr.io \
      #     --username manojRY \
      #     --password ${{ secrets.GHCR_PAT }}


    - name: �🚀 Deploy to Container Apps
      run: |
        az containerapp update \
          --name ${{ secrets.AZURE_CONTAINER_APP_NAME }} \
          --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
          --image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
          --set-env-vars \
            NODE_ENV=production \
            PORT=3000 \
            DB_HOST=${{ secrets.DB_HOST }} \
            DB_PORT=${{ secrets.DB_PORT }} \
            DB_NAME=${{ secrets.DB_NAME }} \
            DB_USER=${{ secrets.DB_USER }} \
            DB_PASSWORD=${{ steps.get-db-password.outputs.DB_PASSWORD }} \
            CORS_ORIGIN="https://www.kisaancenter.com,https://kisaancenter.com"

    - name: ✅ Verify deployment
      run: |
        # Wait for deployment to complete
        sleep 30
        
        # Get the container app URL
        FQDN=$(az containerapp show \
          --name ${{ secrets.AZURE_CONTAINER_APP_NAME }} \
          --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
          --query properties.configuration.ingress.fqdn -o tsv)
        
        echo "Backend API URL: https://$FQDN"
        
        # Check if the app is responding
        if curl -f "https://$FQDN/health" > /dev/null 2>&1; then
          echo "✅ Health check passed"
        else
          echo "⚠️ Health check failed (app might still be starting)"
        fi
        
        # Get latest revision info
        REVISION_NAME=$(az containerapp revision list \
          --name ${{ secrets.AZURE_CONTAINER_APP_NAME }} \
          --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
          --query "[0].name" -o tsv)
        
        echo "Latest revision: $REVISION_NAME"

    - name: 📋 Deployment Summary
      run: |
        echo "🎉 Deployment Summary"
        echo "===================="
        echo "✅ Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
        echo "✅ Container App: ${{ secrets.AZURE_CONTAINER_APP_NAME }}"
        echo "✅ Resource Group: ${{ secrets.AZURE_RESOURCE_GROUP }}"
        echo "✅ Commit SHA: ${{ github.sha }}"
        echo ""
        echo "🔗 View in Azure Portal:"
        echo "https://portal.azure.com/#@/resource/subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/${{ secrets.AZURE_RESOURCE_GROUP }}/providers/Microsoft.App/containerApps/${{ secrets.AZURE_CONTAINER_APP_NAME }}"