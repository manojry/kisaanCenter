# .github/workflows/deploy-backend.yml
name: Deploy Backend to Azure Container Apps

on:
  push:
    branches: [ main ]
    paths: [ 'backend/**' ]
  workflow_dispatch:

env:
  AZURE_CONTAINER_REGISTRY: ${{ secrets.AZURE_CONTAINER_REGISTRY }}
  AZURE_CONTAINER_APP_NAME: ${{ secrets.AZURE_CONTAINER_APP_NAME }}
  AZURE_CONTAINER_APP_ENVIRONMENT: ${{ secrets.AZURE_CONTAINER_APP_ENVIRONMENT }}
  AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: 🛎️ Checkout code
      uses: actions/checkout@v4

    - name: 🔑 Login to Azure
      uses: azure/login@v1
      with:
        creds: |
          {
            "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
            "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
            "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
            "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
          }

    - name: 🐳 Login to Azure Container Registry
      run: |
        az acr login --name ${{ secrets.AZURE_CONTAINER_REGISTRY }}

    - name: 🏗️ Build Docker image
      run: |
        docker build -f Dockerfile -t ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/kisaancenter-backend:${{ github.sha }} .
        docker tag ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/kisaancenter-backend:${{ github.sha }} ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/kisaancenter-backend:latest

    - name: 📦 Push image to ACR
      run: |
        docker push ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/kisaancenter-backend:${{ github.sha }}
        docker push ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/kisaancenter-backend:latest

    - name: 🚀 Deploy to Container Apps
      run: |
        az containerapp update \
          --name ${{ env.AZURE_CONTAINER_APP_NAME }} \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --image ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/kisaancenter-backend:${{ github.sha }}

    - name: ✅ Verify deployment
      run: |
        # Wait for deployment to complete
        sleep 30
        
        # Get the container app URL (internal)
        FQDN=$(az containerapp show \
          --name ${{ env.AZURE_CONTAINER_APP_NAME }} \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --query properties.configuration.ingress.fqdn -o tsv)
        
        echo "Container App URL: https://$FQDN"
        
        # Check if the app is responding (basic health check)
        # Note: This is internal URL, so it might not be accessible from GitHub Actions
        # But we can check if the deployment was successful
        
        REVISION_NAME=$(az containerapp revision list \
          --name ${{ env.AZURE_CONTAINER_APP_NAME }} \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --query "[0].name" -o tsv)
        
        echo "Latest revision: $REVISION_NAME"

    - name: 📋 Deployment Summary
      run: |
        echo "🎉 Deployment Summary"
        echo "===================="
        echo "✅ Image: ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/kisaancenter-backend:${{ github.sha }}"
        echo "✅ Container App: ${{ env.AZURE_CONTAINER_APP_NAME }}"
        echo "✅ Resource Group: ${{ env.AZURE_RESOURCE_GROUP }}"
        echo "✅ Commit SHA: ${{ github.sha }}"
        echo ""
        echo "🔗 View in Azure Portal:"
        echo "https://portal.azure.com/#@/resource/subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/${{ env.AZURE_RESOURCE_GROUP }}/providers/Microsoft.App/containerApps/${{ env.AZURE_CONTAINER_APP_NAME }}"