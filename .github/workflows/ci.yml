name: Continuous Integration

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'

env:
  NODE_VERSION: '18'

jobs:
  backend-validation:
    name: 🔍 Backend Validation
    runs-on: ubuntu-latest
    
    steps:
    - name: 🛎️ Checkout code
      uses: actions/checkout@v4

    - name: 📦 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: kisaan-backend-node/package-lock.json

    - name: 📥 Install dependencies
      working-directory: kisaan-backend-node
      run: npm ci

    - name: 🔍 TypeScript type checking
      working-directory: kisaan-backend-node
      run: npm run build

    - name: 🧹 Lint code
      working-directory: kisaan-backend-node
      run: npm run lint

    - name: 🧪 Run unit tests
      working-directory: kisaan-backend-node
      run: npm test
      continue-on-error: true

    - name: 🧪 Run integration tests
      working-directory: kisaan-backend-node
      run: npm run test:integration
      continue-on-error: true

    - name: 🔒 Security audit
      working-directory: kisaan-backend-node
      run: npm audit --audit-level=high
      continue-on-error: true

    - name: 📊 Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: backend-test-results
        path: kisaan-backend-node/coverage/
        retention-days: 7

  frontend-validation:
    name: 🔍 Frontend Validation
    runs-on: ubuntu-latest
    
    steps:
    - name: 🛎️ Checkout code
      uses: actions/checkout@v4

    - name: 📦 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: kisaan-frontend/package-lock.json

    - name: 📥 Install dependencies
      working-directory: kisaan-frontend
      run: npm ci

    - name: 🔍 TypeScript type checking
      working-directory: kisaan-frontend
      run: npm run build

    - name: 🧹 Lint code
      working-directory: kisaan-frontend
      run: npm run lint
      continue-on-error: true

    - name: 🔒 Security audit
      working-directory: kisaan-frontend
      run: npm audit --audit-level=high
      continue-on-error: true

    - name: 📊 Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: frontend-build
        path: kisaan-frontend/dist/
        retention-days: 7

  security-scan:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: 🛎️ Checkout code
      uses: actions/checkout@v4

    - name: 🔒 Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: 📤 Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  summary:
    name: 📋 CI Summary
    runs-on: ubuntu-latest
    needs: [backend-validation, frontend-validation]
    if: always()
    
    steps:
    - name: 📋 Generate summary
      run: |
        echo "## 🚀 CI Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Backend Validation | ${{ needs.backend-validation.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Frontend Validation | ${{ needs.frontend-validation.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        echo "**Actor:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY