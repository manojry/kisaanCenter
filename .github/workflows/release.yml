name: 🚀 Release Manager

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Type of release'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - prerelease
        default: 'patch'
      custom_tag:
        description: 'Custom release tag (overrides auto-generation)'
        required: false
        type: string
      release_notes:
        description: 'Custom release notes'
        required: false
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: false
        type: boolean
      draft:
        description: 'Create as draft release'
        required: false
        default: false
        type: boolean
      include_docker:
        description: 'Include Docker image in release'
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  packages: write

jobs:
  prepare-release:
    name: 📋 Prepare Release
    runs-on: ubuntu-latest
    outputs:
      new-tag: ${{ steps.version.outputs.new-tag }}
      previous-tag: ${{ steps.version.outputs.previous-tag }}
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Calculate version
        id: version
        run: |
          # Get the latest tag
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "previous-tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          
          if [[ -n "${{ inputs.custom_tag }}" ]]; then
            NEW_TAG="${{ inputs.custom_tag }}"
            if [[ ! "$NEW_TAG" =~ ^v ]]; then
              NEW_TAG="v$NEW_TAG"
            fi
          else
            # Parse version components
            VERSION=${LATEST_TAG#v}
            IFS='.' read -ra VERSION_PARTS <<< "$VERSION"
            MAJOR=${VERSION_PARTS[0]:-0}
            MINOR=${VERSION_PARTS[1]:-0}
            PATCH=${VERSION_PARTS[2]:-0}
            
            # Increment based on release type
            case "${{ inputs.release_type }}" in
              "major")
                MAJOR=$((MAJOR + 1))
                MINOR=0
                PATCH=0
                ;;
              "minor")
                MINOR=$((MINOR + 1))
                PATCH=0
                ;;
              "patch")
                PATCH=$((PATCH + 1))
                ;;
              "prerelease")
                PATCH=$((PATCH + 1))
                NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}-rc.1"
                ;;
            esac
            
            if [[ "${{ inputs.release_type }}" != "prerelease" ]]; then
              NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
            fi
          fi
          
          echo "new-tag=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "📋 Previous tag: $LATEST_TAG"
          echo "📋 New tag: $NEW_TAG"

      - name: 📝 Generate changelog
        id: changelog
        run: |
          PREVIOUS_TAG="${{ steps.version.outputs.previous-tag }}"
          NEW_TAG="${{ steps.version.outputs.new-tag }}"
          
          if [[ -n "${{ inputs.release_notes }}" ]]; then
            CHANGELOG="${{ inputs.release_notes }}"
          else
            # Auto-generate changelog from commits
            if [[ "$PREVIOUS_TAG" != "v0.0.0" ]]; then
              COMMITS=$(git log --pretty=format:"- %s (%h)" $PREVIOUS_TAG..HEAD)
            else
              COMMITS=$(git log --pretty=format:"- %s (%h)" --max-count=20)
            fi
            
            # Categorize commits
            FEATURES=$(echo "$COMMITS" | grep -i "feat\|feature\|add" || true)
            FIXES=$(echo "$COMMITS" | grep -i "fix\|bug" || true)
            DOCS=$(echo "$COMMITS" | grep -i "doc\|readme" || true)
            OTHER=$(echo "$COMMITS" | grep -v -i "feat\|feature\|add\|fix\|bug\|doc\|readme" || true)
            
            CHANGELOG="## What's Changed"
            CHANGELOG+="\n"
            
            if [[ -n "$FEATURES" ]]; then
              CHANGELOG+="\n### ✨ New Features"
              CHANGELOG+="\n$FEATURES"
              CHANGELOG+="\n"
            fi
            
            if [[ -n "$FIXES" ]]; then
              CHANGELOG+="\n### 🐛 Bug Fixes"
              CHANGELOG+="\n$FIXES"
              CHANGELOG+="\n"
            fi
            
            if [[ -n "$DOCS" ]]; then
              CHANGELOG+="\n### 📚 Documentation"
              CHANGELOG+="\n$DOCS"
              CHANGELOG+="\n"
            fi
            
            if [[ -n "$OTHER" ]]; then
              CHANGELOG+="\n### 🔧 Other Changes"
              CHANGELOG+="\n$OTHER"
              CHANGELOG+="\n"
            fi
            
            CHANGELOG+="\n## 🐳 Docker Image"
            CHANGELOG+="\n\`\`\`bash"
            CHANGELOG+="\ndocker pull ghcr.io/${{ github.repository }}:$NEW_TAG"
            CHANGELOG+="\n\`\`\`"
            CHANGELOG+="\n"
            CHANGELOG+="\n## 📊 API Endpoints"
            CHANGELOG+="\n- Health Check: \`GET /health\`"
            CHANGELOG+="\n- API Documentation: \`GET /docs\`"
            CHANGELOG+="\n- OpenAPI Spec: \`GET /openapi.json\`"
            CHANGELOG+="\n"
            CHANGELOG+="\n**Full Changelog**: https://github.com/${{ github.repository }}/compare/$PREVIOUS_TAG...$NEW_TAG"
          fi
          
          # Save changelog to file for multi-line output
          echo "$CHANGELOG" > changelog.md
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          cat changelog.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  build-docker:
    name: 🐳 Build Release Docker Image
    runs-on: ubuntu-latest
    needs: prepare-release
    if: ${{ inputs.include_docker }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🏗️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 📋 Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.prepare-release.outputs.new-tag }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 🐳 Create production Dockerfile
        run: |
          cat > Dockerfile << 'EOF'
          FROM python:3.11-slim as builder
          
          WORKDIR /app
          
          RUN apt-get update && apt-get install -y \
              gcc \
              libpq-dev \
              && rm -rf /var/lib/apt/lists/*
          
          RUN python -m venv /opt/venv
          ENV PATH="/opt/venv/bin:$PATH"
          
          COPY backend/requirements.txt .
          RUN pip install --upgrade pip && \
              pip install --no-cache-dir -r requirements.txt
          
          FROM python:3.11-slim as production
          
          WORKDIR /app
          
          RUN apt-get update && apt-get install -y \
              libpq5 \
              curl \
              && rm -rf /var/lib/apt/lists/* \
              && apt-get clean
          
          COPY --from=builder /opt/venv /opt/venv
          ENV PATH="/opt/venv/bin:$PATH"
          
          COPY backend/ .
          
          RUN useradd --create-home --shell /bin/bash --uid 1000 app && \
              chown -R app:app /app
          USER app
          
          EXPOSE 8000
          
          HEALTHCHECK --interval=30s --timeout=10s --start-period=5s --retries=3 \
            CMD curl -f http://localhost:8000/health || exit 1
          
          CMD ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000"]
          EOF

      - name: 🏗️ Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  create-release:
    name: 🚀 Create GitHub Release
    runs-on: ubuntu-latest
    needs: [prepare-release, build-docker]
    if: always() && !cancelled() && needs.prepare-release.result == 'success'
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔖 Create Git Tag
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git tag ${{ needs.prepare-release.outputs.new-tag }}
          git push origin ${{ needs.prepare-release.outputs.new-tag }}

      - name: 🚀 Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.prepare-release.outputs.new-tag }}
          release_name: "KisaanCenter ${{ needs.prepare-release.outputs.new-tag }}"
          body: ${{ needs.prepare-release.outputs.changelog }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease || contains(needs.prepare-release.outputs.new-tag, '-') }}

      - name: 📊 Release summary
        run: |
          echo "## 🎉 Release Created Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** \`${{ needs.prepare-release.outputs.new-tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Type:** ${{ inputs.release_type }}" >> $GITHUB_STEP_SUMMARY
          echo "**Draft:** ${{ inputs.draft }}" >> $GITHUB_STEP_SUMMARY
          echo "**Pre-release:** ${{ inputs.prerelease }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ inputs.include_docker }}" == "true" ]]; then
            echo "**Docker Image:**" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
            echo "docker pull ghcr.io/${{ github.repository }}:${{ needs.prepare-release.outputs.new-tag }}" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 **Release URL:** https://github.com/${{ github.repository }}/releases/tag/${{ needs.prepare-release.outputs.new-tag }}" >> $GITHUB_STEP_SUMMARY
